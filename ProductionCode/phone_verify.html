<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>UrbanStay — Verify Phone Number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #08A63F;
    --green-dark: #068237;
    --green-glow: rgba(8, 166, 63, 0.16);
    --ink: #111111;
    --muted: #6B7280;
    --line: #E5E7EB;
    --input-bg: #F8F9FA;
    --font: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-height: 100dvh;
    overflow: hidden;
    background: #FFFFFF;
    font-family: var(--font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    touch-action: pan-x pan-y;
  }

  .screen-wrap {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-height: 100dvh;
    max-width: 420px;
    margin: 0 auto;
    background: #FFFFFF;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px 20px 10px;
    overflow: hidden;
  }

  /* ============================================================
     CLEAN OPEN HEADER
     ============================================================ */
  .clean-header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-top: 2px;
    flex-shrink: 0;
  }

  .header-text-group {
    display: flex;
    flex-direction: column;
  }
  .header-title-black {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.1;
    color: var(--ink);
  }
  .header-title-green {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.1;
    color: var(--green);
  }

  .clean-help-link {
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: 0;
    cursor: pointer;
    padding: 4px 6px;
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .clean-help-link:hover {
    color: var(--green);
  }
  .clean-help-link:active {
    transform: scale(0.95);
  }

  /* ============================================================
     STEP 1: PHONE NUMBER INPUT VIEW
     ============================================================ */
  .main-flow-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
    flex-shrink: 0;
  }

  .input-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-bottom: 6px;
    display: block;
  }

  .phone-input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
  }

  .country-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 52px;
    padding: 0 13px;
    background: var(--input-bg);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink);
    flex-shrink: 0;
  }

  .phone-input-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    height: 52px;
    padding: 0 16px;
    background: var(--input-bg);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    transition: all 0.2s ease;
  }
  .phone-input-wrapper:focus-within {
    border-color: var(--green);
    background: #FFFFFF;
    box-shadow: 0 4px 16px var(--green-glow);
  }
  .phone-input-wrapper input {
    width: 100%;
    border: 0;
    background: none;
    font-family: inherit;
    font-size: 16.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--ink);
    outline: none;
  }
  .phone-input-wrapper input::placeholder {
    font-weight: 500;
    color: #9CA3AF;
    letter-spacing: normal;
  }

  /* Single-Line Terms Text */
  .terms-text-single {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 2px;
  }
  .terms-text-single a {
    color: var(--green);
    font-weight: 700;
    text-decoration: underline;
  }

  /* Primary Action Button */
  .btn-continue {
    width: 100%;
    height: 52px;
    border-radius: 16px;
    border: 0;
    background: var(--green);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    cursor: pointer;
    box-shadow: 0 10px 24px -6px rgba(8, 166, 63, 0.42);
    transition: transform 0.2s ease, background 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-continue:active {
    transform: scale(0.985);
    background: var(--green-dark);
  }

  /* ============================================================
     STEP 2: OTP VERIFICATION VIEW (NO BOX)
     ============================================================ */
  #otpSection {
    display: none;
    flex-direction: column;
    gap: 12px;
    margin-top: 10px;
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    flex-shrink: 0;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .otp-info-clean {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0 2px;
  }
  .otp-info-label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
  }
  .otp-phone-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .otp-phone-bold {
    font-size: 15.5px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .edit-link-inline {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--green);
    background: none;
    border: 0;
    cursor: pointer;
    text-decoration: underline;
    padding: 2px 4px;
  }

  /* 6 Digit Boxes */
  .otp-inputs-row {
    display: flex;
    gap: 6px;
    justify-content: space-between;
    margin-top: 2px;
  }
  .otp-digit {
    width: 48px;
    height: 52px;
    border-radius: 14px;
    border: 1.8px solid var(--line);
    background: var(--input-bg);
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
  }
  .otp-digit:focus {
    border-color: var(--green);
    background: #FFFFFF;
    box-shadow: 0 4px 16px var(--green-glow);
  }

  .timer-action-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    padding: 0 2px;
  }
  .resend-active-link {
    color: var(--green);
    font-weight: 700;
    cursor: pointer;
    text-decoration: underline;
  }

  /* ============================================================
     STICKY BOTTOM INDIAN SKYLINE + BENGALURU FOOTER
     ============================================================ */
  .footer-skyline-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 100%;
    margin-top: auto;
    padding-bottom: 2px;
    flex-shrink: 0;
  }

  .skyline-marquee-container {
    width: 100%;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
  }

  .skyline-track {
    display: flex;
    width: max-content;
    align-items: center;
    animation: marqueeScroll 24s linear infinite;
  }
  .skyline-track:hover {
    animation-play-state: paused;
  }

  /* Dynamic Responsive Height that always fits mobile screen 100% */
  .skyline-img {
    height: clamp(140px, 22dvh, 180px);
    width: auto;
    object-fit: contain;
    opacity: 1;
    flex-shrink: 0;
    padding: 0 14px;
  }

  @keyframes marqueeScroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* Sticky Footer Signature - 100% visible on screen without scrolling */
  .built-with-love-block {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-top: 2px;
  }
  .love-text {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .city-text {
    font-size: 14.5px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>

  <div class="screen-wrap">

    <!-- Top Section Container -->
    <div>
      <!-- Clean Open Header -->
      <div class="clean-header-row">
        <div class="header-text-group">
          <h1 class="header-title-black" id="headerLine1">Verify your</h1>
          <h2 class="header-title-green" id="headerLine2">Phone number</h2>
        </div>

        <!-- Right Help Link -->
        <button class="clean-help-link" type="button" onclick="showHelpModal()">help</button>
      </div>

      <!-- Step 1: Phone Number Input -->
      <div id="phoneSection" class="main-flow-container">
        <div>
          <label class="input-label" for="phoneInput">Mobile Number</label>
          
          <div class="phone-input-row">
            <div class="country-badge">
              <span>🇮🇳</span>
              <span>+91</span>
            </div>
            <div class="phone-input-wrapper">
              <input type="tel" id="phoneInput" placeholder="Enter 10-digit number" maxlength="10" pattern="[0-9]{10}" autocomplete="tel" autofocus>
            </div>
          </div>
        </div>

        <!-- Single-Line Terms Notice -->
        <p class="terms-text-single">
          By continuing, you agree to our <a href="javascript:alert('Terms of Service: Authorized software access under Indian IT Act 2000.')">Terms</a> &amp; <a href="javascript:alert('Privacy Policy: All KYC & personal data encrypted under DPDP Act 2023.')">Privacy Policy</a>.
        </p>

        <!-- Primary Continue Button -->
        <button class="btn-continue" type="button" onclick="handleContinue()">
          <span>Continue</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

      <!-- Step 2: OTP Verification View (No Box) -->
      <div id="otpSection">
        <div class="otp-info-clean">
          <span class="otp-info-label">We sent a 6-digit verification code to</span>
          <div class="otp-phone-row">
            <span class="otp-phone-bold" id="otpPhoneDisplay">+91 98765 43210</span>
            <button class="edit-link-inline" type="button" onclick="backToPhoneInput()">Edit</button>
          </div>
        </div>

        <!-- 6 Auto-Advancing Digit Boxes -->
        <div class="otp-inputs-row">
          <input type="tel" class="otp-digit" maxlength="1" oninput="handleOtp(this, 0)" onkeydown="handleOtpKey(event, 0)">
          <input type="tel" class="otp-digit" maxlength="1" oninput="handleOtp(this, 1)" onkeydown="handleOtpKey(event, 1)">
          <input type="tel" class="otp-digit" maxlength="1" oninput="handleOtp(this, 2)" onkeydown="handleOtpKey(event, 2)">
          <input type="tel" class="otp-digit" maxlength="1" oninput="handleOtp(this, 3)" onkeydown="handleOtpKey(event, 3)">
          <input type="tel" class="otp-digit" maxlength="1" oninput="handleOtp(this, 4)" onkeydown="handleOtpKey(event, 4)">
          <input type="tel" class="otp-digit" maxlength="1" oninput="handleOtp(this, 5)" onkeydown="handleOtpKey(event, 5)">
        </div>

        <div class="timer-action-row">
          <span id="timerLabel">Resend in <b id="timerSeconds">28</b>s</span>
          <span id="resendBtn" class="resend-active-link" style="display: none;" onclick="startOtpTimer()">Resend Code</span>
        </div>

        <!-- Verify Button -->
        <button class="btn-continue" type="button" onclick="verifyOtpCode()">
          <span>Verify &amp; Continue</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <!-- Sticky Bottom Section (Guaranteed 100% visible in 1 screen) -->
    <div class="footer-skyline-wrapper">
      <div class="skyline-marquee-container">
        <div class="skyline-track">
          <img src="../webdev/assets/Scrool Animatein fit.png" alt="India Heritage Skyline" class="skyline-img">
          <img src="../webdev/assets/Scrool Animatein fit.png" alt="India Heritage Skyline" class="skyline-img" aria-hidden="true">
        </div>
      </div>

      <!-- Static Clean Footer Statement -->
      <div class="built-with-love-block">
        <span class="love-text">built with love in,</span>
        <span class="city-text">Bengaluru, Karnataka</span>
      </div>
    </div>

  </div>

  <script>
    let timerInt = null;

    function handleContinue() {
      const phone = document.getElementById('phoneInput').value.trim();
      if (!phone || phone.length < 10) {
        alert('Please enter a valid 10-digit mobile number.');
        return;
      }

      // Switch views
      document.getElementById('phoneSection').style.display = 'none';
      document.getElementById('otpSection').style.display = 'flex';

      // Update Header Text
      document.getElementById('headerLine1').textContent = 'Enter 6-Digit';
      document.getElementById('headerLine2').textContent = 'Verification OTP';

      // Format Phone Display
      document.getElementById('otpPhoneDisplay').textContent = '+91 ' + phone.slice(0, 5) + ' ' + phone.slice(5);

      startOtpTimer();

      setTimeout(() => {
        const first = document.querySelectorAll('.otp-digit')[0];
        if (first) first.focus();
      }, 100);
    }

    function backToPhoneInput() {
      clearInterval(timerInt);
      document.getElementById('otpSection').style.display = 'none';
      document.getElementById('phoneSection').style.display = 'flex';

      document.getElementById('headerLine1').textContent = 'Verify your';
      document.getElementById('headerLine2').textContent = 'Phone number';
    }

    function startOtpTimer() {
      let sec = 28;
      const countEl = document.getElementById('timerSeconds');
      const labelEl = document.getElementById('timerLabel');
      const resendBtn = document.getElementById('resendBtn');

      labelEl.style.display = 'inline';
      resendBtn.style.display = 'none';
      countEl.textContent = sec;

      clearInterval(timerInt);
      timerInt = setInterval(() => {
        sec--;
        countEl.textContent = sec;
        if (sec <= 0) {
          clearInterval(timerInt);
          labelEl.style.display = 'none';
          resendBtn.style.display = 'inline';
        }
      }, 1000);
    }

    function handleOtp(input, idx) {
      if (input.value.length === 1) {
        const digits = document.querySelectorAll('.otp-digit');
        if (idx < digits.length - 1) {
          digits[idx + 1].focus();
        }
      }
    }

    function handleOtpKey(e, idx) {
      if (e.key === 'Backspace') {
        const digits = document.querySelectorAll('.otp-digit');
        if (!digits[idx].value && idx > 0) {
          digits[idx - 1].focus();
        }
      }
    }

    function verifyOtpCode() {
      const digits = document.querySelectorAll('.otp-digit');
      let otp = '';
      digits.forEach(d => otp += d.value);

      if (otp.length < 6) {
        alert('Please enter all 6 digits of the OTP.');
        return;
      }

      // Smooth transition to Role Selection
      window.location.href = 'auth_preview.html';
    }

    function showHelpModal() {
      alert('UrbanStay Support:\nWhatsApp: +91 9876543210\nEmail: support@urbanstay.living');
    }
  </script>
</body>
</html>
